      type: post
      title: Open Source Sustainability through Corporate Social Responsibility
      description: The recent Log4j vulnerability has once again sparked a lot of
        debate around our reliance on open source projects and their sustainability
        challenges. I argue that money cannot fix this issue, nor can hiding behind
        security scans, audits and other defenses. The solution is to genuinely understand
        the open source community, acknowledge the shared responsibility we have in
        our commons and through the well-understood tool of Corporate Social Responsibility,
        look to fill the ethical and philanthropic gaps.
      url: https://blog.scottlogic.com/2021/12/20/open-source-sustainability.html
