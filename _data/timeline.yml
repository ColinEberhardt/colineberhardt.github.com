  - month: January
    entries:
    - date: '2024-01-22'
      type: podcast
      title: 'Beyond the Hype: Was the threat the CRA seemed to pose to open source
        just hype?'
      description: In this episode, I'm joined by Rebecca Rumbul, CEO of Rust Foundation,
        and Mirko Boehm from Linux Foundation Europe. We discuss the Cyber Resilience
        Act (CRA), a piece of EU legislation that is actively under development, designed
        to make end-user products more secure. Early drafts of this act detailed significant
        obligations on open source maintainers, despite the fact that they often work
        without financial reward. We discuss how the latest update of the CRA has
        thankfully addressed these concerns and ponder whether it will actually solve
        the problems it has set out to tackle.
      url: https://blog.scottlogic.com/2024/01/22/beyond-the-hype-was-the-threat-the-cra-seemed-to-pose-to-open-source-just-hype.html
