      type: podcast
      title: Beyond the Hype - Do you actually need a microfrontend?
      description: A relatively new architectural style for building web-based applications,
        micro-frontends are an extension of the popular microservices pattern where
        the vertical slice of functionality that a microservice provides is extended
        all the way to the front-end. With micro-frontends, you can more easily scale
        your development teams by composing applications from loosely coupled frontend
        components. In this podcast we ask the question 'Do you actually need a micro-frontend?'
      url: https://blog.scottlogic.com/2022/04/05/beyond-the-hype-microfrontends.html
