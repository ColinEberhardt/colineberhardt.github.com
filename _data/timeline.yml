  - month: December
    entries:
    - date: '2025-12-22'
      type: post
      title: The power of agentic loops - implementing flexbox layout in 3 hours
      description: By leveraging AI agents with iterative feedback loops, a complete
        flexbox layout algorithm was implemented in just 3 hours, a task that took
        two weeks back in 2015. The key to this productivity gain was creating an
        effective agentic loop where the AI could test, debug, and improve its code
        autonomously using a browser's layout engine as a reference implementation.
      url: https://blog.scottlogic.com/2025/12/22/power-of-agentic-loops.html
    - date: '2025-12-11'
      type: talk
      title: 'From Guardrails to Guidance: Evolving with the AI Frontier'
      event: FINOS Developer Day at apidays Paris
      description: Agentic AI is one of the most disruptive technologies of our time,
        but its risks — hallucinations, inconsistency, limited explainability — make
        safe deployment a real challenge. This talk explores how to maximise value
        while managing those risks responsibly, introducing the FINOS AI Governance
        Framework as a practical guide for meeting regulatory expectations.
      url: https://www.youtube.com/watch?v=b1okVuDW_fw
      photo: ''
  - month: November
    entries:
    - date: '2025-11-26'
      type: post
      title: 'Putting Spec Kit Through Its Paces: Radical Idea or Reinvented Waterfall?'
      description: Spec-Driven Development promises reliable, specification-led software
        generation, but in practice I found the workflow slow, heavy, and less effective
        than iterative prompting. This post walks through a real-world test using
        Spec Kit and explains why traditional AI-assisted development still outpaces
        SDD by a wide margin.
      url: https://blog.scottlogic.com/2025/11/26/putting-spec-kit-through-its-paces-radical-idea-or-reinvented-waterfall.html
