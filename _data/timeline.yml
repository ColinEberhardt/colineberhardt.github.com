    entries:
    - date: '2023-12-18'
      type: post
      title: If software development were a race, AI wins every time
      description: We’ve undertaken experiments to explore the impact of GenAI tools
        on developer productivity, revealing a 37% improvement in productivity (speed),
        however, this result is a misrepresentation of what it means to be productive
        as a developer. This article delves more deeply, beyond punchy metrics, to
        explore the overall experience of working with these entirely new tools. We
        discuss where these tools are most effective, the challenge of quality code,
        the learning curve and much more.
      url: https://blog.scottlogic.com/2023/12/18/software-development-ai-wins-the-race.html
