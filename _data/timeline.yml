      type: post
      title: 'Learning to Code Again: Adopting AI Developer Tools'
      description: Adopting AI-powered developer tools like GitHub Copilot and ChatGPT
        is a challenging yet rewarding journey that requires time, experimentation,
        and a shift in how developers approach their workflows. This post explores
        why these tools are hard to learn, how they disrupt traditional flow states,
        and offers practical advice for integrating them effectively into day-to-day
        coding.
      url: https://blog.scottlogic.com/2025/05/08/new-tools-new-flow-the-cognitive-shift-of-ai-powered-coding.html
  - month: April
    entries:
    - date: '2025-04-01'
      type: post
      title: Making Sense of the AI Developer Tools Ecosystem
      description: The AI developer tooling landscape has rapidly expanded from simple
        autocomplete to a complex ecosystem of assistants, agents, and AI-first environments.
        In this post, I propose a practical classification based on how AI is positioned
        within your workflow—from "arm’s length" tools like ChatGPT to fully "AI-first"
        environments like Cursor.
      url: https://blog.scottlogic.com/2025/04/01/making-sense-of-the-ai-developer-tools-ecosystem.html
  - month: March
    entries:
    - date: '2025-03-06'
      type: post
      title: LLMs Don’t Know What They Don’t Know—And That’s a Problem
      description: LLMs are not just limited by hallucinations—they fundamentally
        lack awareness of their own capabilities, making them overconfident in executing
        tasks they don’t fully understand. While “vibe coding” embraces AI’s ability
        to generate quick solutions, true progress lies in models that can acknowledge
        ambiguity, seek clarification, and recognise when they are out of their depth.
      url: https://blog.scottlogic.com/2025/03/06/llms-dont-know-what-they-dont-know-and-thats-a-problem.html
  - month: February
    entries:
    - date: '2025-02-21'
      type: post
      title: AI’s Biggest Flaw? The Blinking Cursor Problem
      description: AI's potential is immense, yet clunky user interfaces and a lack
        of discoverability are holding it back from seamless adoption. To unlock AI’s
        true power, we need interfaces that guide, adapt, and engage—moving beyond
        the blinking cursor to something more intuitive, proactive, and, ultimately,
        more human.
      url: https://blog.scottlogic.com/2025/02/21/ais-biggest-flaw-the-blinking-cursor-problem.html
  - month: January
    entries:
    - date: '2025-01-22'
      type: post
      title: The UK’s AI Opportunities Action Plan – somewhat quiet on risks
      description: Last week the UK government launched their 50-point AI Opportunities
        Action Plan. The plan is ambitious, but it is something of a mixed bag. Some
        sizeable and worthwhile investments, alongside others which are quite questionable.
        But what I am more concerned with is what is missing. The plan has optimistic,
        upbeat and pro-innovation, but is rather silent on the risks.
      url: https://blog.scottlogic.com/2025/01/22/the-uks-ai-opportunities-action-plan-somewhat-quiet-on-risks.html
