      type: post
      title: If AI Writes the Code, Who Builds the Next Open Source Project?
      description: AI was trained on open source, but its rapid progress is now raising
        difficult legal, technical, and cultural questions for the ecosystem that
        enabled it. From copyright and “fair use” debates to AI-generated code, cloned
        frameworks, and autonomous coding agents, this post explores how AI may reshape
        the future motivations and sustainability of open source.
