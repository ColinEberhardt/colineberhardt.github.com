# Site settings
title: "Colin Eberhardt, CV"
description: "Colin Eberhardt's public resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Colin Eberhardt"
resume_title:                   "CTO, Scott Logic  ·  FINOS Board Member"
resume_contact_email:           "ceberhardt@scottlogic.com"
resume_header_intro: "<p>I lead technology at <a href=\"https://www.scottlogic.com/\">Scott Logic</a>, a UK-based software consultancy delivering bespoke software to financial services and public sector. Board member of <a href=\"https://www.finos.org/\">FINOS</a>, shaping open source strategy for fintech. Technologist, author, blogger, and speaker.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "no"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       false
resume_section_projects:        false
resume_section_skills:          false
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    false
resume_section_publications:    false
resume_section_timeline:        true
resume_section_interests:       false

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/colineberhardt"
  # resume_twitter_url:           "https://twitter.com/ColinEberhardt"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://uk.linkedin.com/in/colin-eberhardt-1464b4a"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "http://blog.scottlogic.com/ceberhardt/"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
